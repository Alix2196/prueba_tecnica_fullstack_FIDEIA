spring:
  application:
    name: tickets-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.20.100:5434/db_pruebas}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    # El esquema es propiedad de db/schema.sql (ver README seccion 7), no de
    # Hibernate: "validate" detecta a arranque cualquier desalineacion entre
    # las entidades y la base de datos real, sin intentar modificarla nunca.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
